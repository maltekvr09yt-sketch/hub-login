name: Build Hub-Login

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          unzip -o hub-login-1.0.0.zip -d project

      - name: Ustaw Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Znajdź pom.xml
        run: |
          POM=$(find project -name pom.xml -type f | head -n 1)
          echo "Znaleziono: $POM"
          echo "POM=$POM" >> "$GITHUB_ENV"

      - name: Zbuduj plugin
        run: |
          mvn -f "$POM" clean package

      - name: Udostępnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: hub-login-1.0.0
          path: |
            project/**/target/hub-login-1.0.0.jar
